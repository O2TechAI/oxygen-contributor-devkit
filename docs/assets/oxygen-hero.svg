<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Oxygen — from agent sessions to reusable knowledge</title>
<desc id="desc">Illustrative conversation cards orbit Oxygen. User corrections and agent discoveries lead to readable summaries and reusable insights, reviewed by a human before reuse.</desc>
<defs>
  <radialGradient id="halo"><stop stop-color="#DCECCD" stop-opacity=".8"/><stop offset="1" stop-color="#F8FAF6" stop-opacity="0"/></radialGradient>
  <linearGradient id="orb" x1="540" y1="180" x2="770" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#FBFFF6"/><stop offset=".65" stop-color="#E6F0DC"/><stop offset="1" stop-color="#C8DDBC"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#24472D" flood-opacity=".12"/></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#44633C" flood-opacity=".16"/></filter>
</defs>
<rect width="1320" height="650" rx="24" fill="#F8FAF6"/>
<ellipse cx="660" cy="316" rx="490" ry="315" fill="url(#halo)"/>
<g stroke="#CFDECA"><ellipse cx="660" cy="310" rx="520" ry="208" transform="rotate(-8 660 310)"/><ellipse cx="660" cy="310" rx="425" ry="244" transform="rotate(12 660 310)" stroke-dasharray="3 8"/><ellipse cx="660" cy="310" rx="333" ry="205" stroke-opacity=".6"/></g>
<g fill="#88AD77"><circle cx="370" cy="117" r="6"/><circle cx="1021" cy="463" r="7"/><circle cx="741" cy="75" r="4"/><circle cx="493" cy="497" r="4"/></g>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
  <text x="72" y="49" font-size="12" font-weight="600" letter-spacing="2" fill="#73866C">EVERY SESSION HAS SOMETHING WORTH KEEPING</text>
  <text x="1248" y="49" text-anchor="end" font-size="11" letter-spacing="1.6" fill="#8B9B84">ILLUSTRATIVE WORKFLOW</text>
  <g filter="url(#soft)"><circle cx="660" cy="300" r="137" fill="url(#orb)" stroke="#BED2B1"/><circle cx="660" cy="300" r="123" stroke="#FFF" stroke-width="2"/></g>
  <g transform="translate(630 210)"><circle cx="23" cy="27" r="23" stroke="#345E40" stroke-width="6"/><circle cx="54" cy="2" r="9" fill="#8EB574"/></g>
  <text x="660" y="319" text-anchor="middle" font-size="43" font-weight="650" letter-spacing="-1.7" fill="#284B32">Oxygen</text>
  <text x="660" y="350" text-anchor="middle" font-size="15" fill="#66815B">Turn experience into</text>
  <text x="660" y="373" text-anchor="middle" font-size="15" fill="#66815B">knowledge worth keeping.</text>

  <g transform="translate(68 103) rotate(-4 180 86)">
    <rect width="356" height="169" rx="16" fill="white" stroke="#D3DFCD" filter="url(#shadow)"/>
    <rect x="19" y="18" width="29" height="29" rx="9" fill="#E5EFDA"/>
    <path d="M26 26h15v10h-9l-4 4v-4h-2z" stroke="#658450" stroke-width="1.5"/>
    <text x="59" y="38" font-size="12" font-weight="650" letter-spacing=".9" fill="#6C805D">USER CORRECTION</text>
    <text x="22" y="83" font-size="21" font-weight="600" fill="#30452D">“That baseline answers</text>
    <text x="22" y="111" font-size="21" font-weight="600" fill="#30452D">a different question.”</text>
    <path d="M22 141H181" stroke="#E1E9DA" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(96 319) rotate(3 180 86)">
    <rect width="356" height="172" rx="16" fill="white" stroke="#CDDED5" filter="url(#shadow)"/>
    <rect x="19" y="18" width="29" height="29" rx="9" fill="#E1EEE7"/>
    <path d="m34 23 2 7 7 2-7 2-2 7-2-7-7-2 7-2z" stroke="#608270" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="59" y="38" font-size="12" font-weight="650" letter-spacing=".9" fill="#5D7E6B">AGENT DISCOVERY</text>
    <text x="22" y="82" font-size="20" font-weight="600" fill="#304D3E">“The numbers were right.</text>
    <text x="22" y="110" font-size="20" font-weight="600" fill="#304D3E">The comparison had changed.”</text>
    <text x="22" y="146" font-size="13" fill="#82958A">A useful correction becomes a method.</text>
  </g>
  <g transform="translate(893 98) rotate(4 174 90)">
    <rect x="7" y="8" width="348" height="178" rx="16" fill="#E6EDDF" stroke="#D0DDC7"/>
    <rect width="348" height="178" rx="16" fill="white" stroke="#D3DFCD" filter="url(#shadow)"/>
    <text x="22" y="36" font-size="12" font-weight="650" letter-spacing="1" fill="#7D895C">READABLE SUMMARY</text>
    <text x="22" y="74" font-size="22" font-weight="600" fill="#34462E">What changed, and why.</text>
    <text x="22" y="109" font-size="16" fill="#74806A">The context, the evidence, and the</text>
    <text x="22" y="133" font-size="16" fill="#74806A">outcome — in a story you can follow.</text>
    <path d="M22 157H149" stroke="#E3E9DA" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(872 325) rotate(-3 180 86)">
    <rect x="8" y="9" width="368" height="183" rx="16" fill="#CFDFC2" stroke="#BBCDAE"/>
    <rect width="368" height="183" rx="16" fill="#EDF5E5" stroke="#BACCAC" filter="url(#shadow)"/>
    <text x="22" y="36" font-size="12" font-weight="650" letter-spacing="1" fill="#6B8358">REUSABLE INSIGHT</text>
    <text x="22" y="68" font-size="22" font-weight="600" fill="#304C2F">Check what the comparison</text>
    <text x="22" y="95" font-size="22" font-weight="600" fill="#304C2F">means.</text>
    <text x="22" y="125" font-size="16" fill="#647E56">Before choosing a winner, check whether</text>
    <text x="22" y="147" font-size="16" fill="#647E56">the results answer the same question.</text>
    <text x="22" y="172" font-size="11" letter-spacing=".7" fill="#7B916E">WHEN TO USE · WORKFLOW · EXAMPLE · EVIDENCE</text>
  </g>
  <path d="M470 283h28m-7-6 7 6-7 6M820 283h28m-7-6 7 6-7 6" stroke="#7A9C6C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(370 555)">
    <rect width="580" height="56" rx="28" fill="#294D36"/>
    <text x="27" y="34" font-size="14" font-weight="600" fill="#F0F6E9">YOUR REVIEW</text>
    <path d="M164 16v24" stroke="#688463"/>
    <path d="m192 28 4 4 8-9" stroke="#BFDBA4" stroke-width="2" stroke-linecap="round"/>
    <text x="214" y="34" font-size="14" fill="#DCEBCC">Keep</text>
    <path d="m284 34 2-8 9-9 5 5-9 9-7 3" stroke="#BFDBA4" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="310" y="34" font-size="14" fill="#DCEBCC">Edit</text>
    <path d="m377 23 10 10m0-10-10 10" stroke="#BFDBA4" stroke-width="1.7" stroke-linecap="round"/>
    <text x="400" y="34" font-size="14" fill="#DCEBCC">Decline</text>
    <path d="M478 16v24" stroke="#688463"/>
    <text x="503" y="34" font-size="14" fill="#DCEBCC">Export</text>
  </g>
</g>
</svg>
